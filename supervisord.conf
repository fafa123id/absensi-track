[supervisord]
nodaemon=true
user=www

[program:queue]
command=php /var/www/absensi_track/artisan queue:work --sleep=1 --tries=3 --max-time=3600
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/www/absensi_track/storage/logs/queue.log

[program:reverb]
command=php /var/www/artisan reverb:start
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/www/absensi_track/storage/logs/reverb.log
