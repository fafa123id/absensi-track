networks:
  shared-network:
    external: true

volumes:
  app_storage:
  laravel_cache:

services:
  app-absensi:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - GIT_HASH=${GIT_HASH:-unknown}
      target: app
    container_name: absensi_track_app
    restart: unless-stopped
    working_dir: /var/www/absensi_track
    env_file: ./.env
    environment:
      - VIRTUAL_PORT=9001
      - VIRTUAL_HOST=absensi-track.bornhub.cloud
      - LETSENCRYPT_HOST=absensi-track.bornhub.cloud
      - LETSENCRYPT_EMAIL=ahmadfauzanroziqin@gmail.com
    volumes:
      - app_storage:/var/www/absensi_track/storage
      - laravel_cache:/var/www/absensi_track/bootstrap/cache
    networks:
      - shared-network

  # nginx-absensi:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #     target: web
  #   container_name: absensi_track_nginx
  #   restart: unless-stopped
  #   environment:
  #     - VIRTUAL_HOST=absensi-track.bornhub.cloud
  #     - LETSENCRYPT_HOST=absensi-track.bornhub.cloud
  #     - LETSENCRYPT_EMAIL=ahmadfauzanroziqin@gmail.com
  #   networks:
  #     - shared-network 
  #   depends_on:
  #     - app-absensi  
  #     - worker-absensi

  worker-absensi: 
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        - GIT_HASH=${GIT_HASH:-unknown}
    container_name: absensi_track_queue
    restart: unless-stopped
    command: /usr/bin/supervisord -c /etc/supervisor/supervisord.conf
    env_file: ./.env
    working_dir: /var/www/absensi_track
    volumes:
      - app_storage:/var/www/absensi_track/storage
      - laravel_cache:/var/www/absensi_track/bootstrap/cache
    environment:
      - VIRTUAL_HOST=reverb.absensi-track.bornhub.cloud
      - VIRTUAL_PORT=8080
      - LETSENCRYPT_HOST=reverb.absensi-track.bornhub.cloud
      - LETSENCRYPT_EMAIL=ahmadfauzanroziqin@gmail.com
    networks:
      - shared-network 
    depends_on:
      - app-absensi