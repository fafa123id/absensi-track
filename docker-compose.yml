
networks:
  shared-network:
    external: true

volumes:
  app_storage:
    name: absensi_track_app_storage

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app 
      args:
        - GIT_HASH=${GIT_HASH:-unknown}
    container_name: absensi_track_app
    restart: unless-stopped
    working_dir: /var/www/absensi-track
    env_file: .env
    volumes:
      - app_storage:/var/www/absensi-track/storage
    networks:
      - shared-network
  #--- Service Nginx (Web Server & Reverse Proxy buat Laravel & Reverb) ---
  nginx: # Ganti 'web' jadi 'nginx' biar jelas
    image: nginx:alpine
    container_name: absensi_track_nginx
    restart: unless-stopped
    environment:
      - VIRTUAL_HOST=absensi-track.bornhub.cloud
      - LETSENCRYPT_HOST=absensi-track.bornhub.cloud
      - LETSENCRYPT_EMAIL=ahmadfauzanroziqin@gmail.com
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - shared-network 
    depends_on:
      app:
        condition: service_started
      reverb: 
        condition: service_started

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        - GIT_HASH=${GIT_HASH:-unknown}
    container_name: absensi_track_reverb
    restart: unless-stopped
    env_file: .env
    working_dir: /var/www/absensi-track
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    volumes:
      - app_storage:/var/www/absensi-track/storage
    networks:
      - shared-network 
    depends_on:
      - app

  worker: 
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        - GIT_HASH=${GIT_HASH:-unknown}
    container_name: absensi_track_queue
    restart: unless-stopped
    command: /usr/bin/supervisord -c /etc/supervisor/supervisord.conf
    env_file: .env
    working_dir: /var/www/absensi-track
    volumes:
      - app_storage:/var/www/absensi-track/storage
    networks:
      - shared-network 
    depends_on:
      - app


