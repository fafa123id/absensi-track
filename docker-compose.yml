networks:
  shared:
    external: true
    name: shared-network
  appnet: 
    driver: bridge

volumes:
  app_storage:

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: app
    restart: unless-stopped
    env_file: .env
    volumes:
      - app_storage:/var/www/absensi-track/storage
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - appnet
      - shared

  web:
    image: nginx:alpine
    container_name: web
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - app_storage:/var/www/absensi-track/storage:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      VIRTUAL_HOST: absensi-track.bornhub.cloud
      LETSENCRYPT_HOST: absensi-track.bornhub.cloud
      LETSENCRYPT_EMAIL: ahmadfauzanroziqin@gmail.com
    networks:
      - appnet
      - shared-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://app:9000"]
      interval: 30s
      timeout: 5s
      retries: 5

  reverb:
    container_name: reverb
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"

      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080

      REVERB_HOST: ws.absensi-track.bornhub.cloud
      REVERB_PORT: 443
      REVERB_SCHEME: https

      # kredensial Reverb (isi di .env)
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
    command: >
      sh -lc 'php artisan reverb:start --host="$REVERB_SERVER_HOST" --port="$REVERB_SERVER_PORT"'
    networks:
      - appnet

  reverb-proxy:
    image: nginx:alpine
    container_name: reverb-proxy
    restart: unless-stopped
    depends_on:
      - reverb
    volumes:
      - ./reverb-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      VIRTUAL_HOST: ws.absensi-track.bornhub.cloud
      LETSENCRYPT_HOST: ws.absensi-track.bornhub.cloud
      LETSENCRYPT_EMAIL: ahmadfauzanroziqin@gmail.com
    networks:
      - appnet
      - shared-network

  worker:
    container_name: worker
    restart: unless-stopped
    env_file: .env
    command: >
      sh -lc '
        echo "starting supervisord";
        supervisord -c /etc/supervisor/supervisord.conf
      '
    volumes:
      - app_storage:/var/www/absensi-track/storage
      - ./supervisord.conf:/etc/supervisor/supervisord.conf:ro
    depends_on:
      - app
    networks:
      - appnet
