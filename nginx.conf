server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    root /var/www/absensi_track/public;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app-absensi:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/absensi_track/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/absensi_track/public;
        fastcgi_param REMOTE_ADDR $remote_addr;
    }

    location ~ /\.ht {
        deny all;
    }
}
